plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualscanner.gun'
    compileSdk 36

    defaultConfig {
        applicationId "com.virtualscanner.gun"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1-demo"
        // 编译时间戳：注入到 BuildConfig，关于页展示「编译时间」
        buildConfigField "long", "BUILD_TIME", System.currentTimeMillis() + "L"
    }

    buildFeatures {
        buildConfig true
    }

    // 支持三类语言：英语（默认）/ 简体中文 / 繁体中文
    // 资源目录：values、values-zh、values-b+zh+Hant

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }
}

// README 进 App：每次构建把仓库根目录的 README.md 拷成 assets/readme.md，
// 「关于 → 项目说明」直接读它。这样 App 里那份永远不会和仓库脱节，
// 也不需要手工维护两份文档。
tasks.register('syncReadme', Copy) {
    from(rootProject.file('README.md'))
    into(layout.projectDirectory.dir('src/main/assets'))
    rename { 'readme.md' }
}
preBuild.dependsOn 'syncReadme'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'

    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// Shizuku / ML Kit 会带进不同版本的 kotlin-stdlib，1.8 之后 jdk7/jdk8 已并入主包，
// 不统一版本会出现 duplicate class。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}
